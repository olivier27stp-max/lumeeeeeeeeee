name: CI

# Quality gate: runs on every push to main and on every pull request.
# The `quality` job is BLOCKING — wire it as a required status check in
# GitHub branch protection so a red build cannot be merged into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lancement À LA DEMANDE (Actions → CI → Run workflow) : c'est le seul chemin
  # qui joue la suite COMPLÈTE des automatisations contre staging (voir le job
  # `automatisations`).
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Tests (vitest — RBAC, tenant isolation, compliance, automation)
        run: npm run test

      - name: Build (vite)
        run: npm run build

  # Lumi et l'agent de support : UN verdict (npm run test:lumi), avec un rapport
  # JSON + markdown pour QA Smoke. Ici, l'étage déterministe seulement — tests de
  # Lumi, du support, du MCP et du jeu d'évals, sans réseau ni secret. BLOQUANT :
  # à déclarer « required » dans la protection de branche. Les étages joués
  # contre la production (batteries critique et de robustesse, 221 demandes) se
  # lancent à la main : `npm run test:lumi -- --prod --bureau eval2`.
  lumi:
    name: Lumi (npm run test:lumi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: test:lumi (étage déterministe)
        run: npm run test:lumi -- --sortie rapports/lumi/test-lumi

      - name: Rapport pour QA Smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-lumi
          path: rapports/lumi/
          if-no-files-found: warn

  # Cross-tenant RLS isolation — impersonates authenticated users + anon and
  # asserts no relation leaks another org (reads, anon, child tables, writes).
  # Catches the class of bug fixed 2026-07-08 (properties_active, team_members…).
  # Set the RLS_TEST_DB_URL secret to a STAGING DB seeded with >=2 orgs to enable;
  # skips (green) until then, fails the build on any leak once wired.
  #
  # DEUX USERS MONO-ORG STABLES REQUIS. Le test a besoin de deux utilisateurs
  # appartenant chacun à UNE seule org distincte. Il pioche en priorité la
  # fixture dédiée (rlsfix.user0/1@fixture.lume.test), semée une fois par
  # `npm run seed:rls` et JAMAIS touchée par les suites QA — sans elle, il
  # retombait sur des memberships aléatoires que le QA crée/supprime, d'où un
  # flake « Need >=2 single-org users » sur des PR sans rapport. La fixture est
  # persistante dans staging ; re-semer seulement après un `db:clone-staging`.
  rls-isolation:
    name: RLS cross-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le secret DOIT être là partout où GitHub le fournit : push sur main, ou PR
    # de ce dépôt ouverte par un humain. Avant, un secret absent faisait
    # « exit 0 » en silence — la vérification affichait « success » alors que
    # rien n'avait tourné. GitHub ne passe pas les secrets aux PR de forks ni
    # à Dependabot (github.actor décide des privilèges, re-run compris) : là
    # seulement, sauter reste légitime.
    env:
      SECRET_ATTENDU: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: RLS isolation test
        env:
          DB_URL: ${{ secrets.RLS_TEST_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            if [ "$SECRET_ATTENDU" = "true" ]; then
              echo "::error::RLS_TEST_DB_URL absent alors que ce contexte y a droit — la garde ne tourne pas. Rétablir le secret du dépôt."
              exit 1
            fi
            echo "::warning::RLS_TEST_DB_URL not set — skipping cross-tenant isolation test. Add a staging (>=2 orgs) DB connection string as the RLS_TEST_DB_URL repo secret to enable."
            exit 0
          fi
          npm run test:rls
      # Le détecteur qui aurait attrapé team_members.full_name (sélecteur
      # d'assignation mort, audit QA 2026-09-09) — il n'était jamais lancé.
      # Lit pg_catalog via la même connexion staging ; aucun jeton d'API.
      - name: Colonnes / valeurs / RPC citées par le code existent en base
        env:
          DB_URL: ${{ secrets.RLS_TEST_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            if [ "$SECRET_ATTENDU" = "true" ]; then
              echo "::error::RLS_TEST_DB_URL absent alors que ce contexte y a droit — la garde ne tourne pas. Rétablir le secret du dépôt."
              exit 1
            fi
            echo "::warning::RLS_TEST_DB_URL not set — skipping check:schema-refs."
            exit 0
          fi
          npm run check:schema-refs

  # Suite des automatisations (npm run test:automations).
  #
  # Sur CHAQUE PR et chaque poussée : les tests UNITAIRES de la suite seulement
  # (fonctions pures du moteur, aucune base touchée).
  # À LA DEMANDE (workflow_dispatch) : la suite COMPLÈTE — le VRAI moteur contre
  # staging, sur un bureau de test en bac à sable (aucun envoi réel possible :
  # voir tests/automations-suite/harnais/), un verrou en base l'empêchant de
  # tourner deux fois à la fois.
  #
  # Pourquoi plus la suite complète sur chaque PR : le 2026-10-01, six PR de
  # plusieurs sessions l'ont enchaînée contre staging toute la soirée (≈ 1 h
  # chacune, les autres interrogeant le verrou toutes les 20 s). Staging — une
  # petite instance partagée — est tombé à 22:08 UTC, une heure après une
  # panne de la prod sous une charge de tests comparable. Une base partagée ne
  # porte pas une suite d'intégration par PR.
  # BLOQUANT : un seul test rouge fait échouer le job.
  automatisations:
    name: Automatisations (npm run test:automations)
    runs-on: ubuntu-latest
    # Unitaires : quelques minutes. Suite complète (à la demande) : ~30 min, le
    # double sur un staging chargé, plus l'attente du verrou de la suite.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 30 }}
    # Groupe PAR PR (une nouvelle poussée remplace la précédente). L'exclusion
    # entre deux suites complètes se fait dans la suite elle-même, par un
    # verrou en base (scripts/qa/verrou-suite-automatisations.mts).
    concurrency:
      group: automatisations-${{ github.ref }}
      cancel-in-progress: true
    env:
      SUITE_COMPLETE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests unitaires de la suite (aucune base)
        if: env.SUITE_COMPLETE != 'true'
        run: npm run test:automations:unitaires
      - name: Navigateur des tests d'interface
        if: env.SUITE_COMPLETE == 'true'
        run: npx playwright install --with-deps chromium
      - name: Suite complète contre staging (à la demande)
        if: env.SUITE_COMPLETE == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secrets staging LUMI_EVAL_* absents — la suite complète des automatisations ne peut pas tourner."
            exit 1
          fi
          npm run test:automations
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-automatisations
          path: rapports/automatisations/
          if-no-files-found: warn

  # Non-blocking: surfaces vulnerable dependencies without failing the merge.
  # Promote to blocking later by removing continue-on-error.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm audit (high severity)
        run: npm audit --audit-level=high

name: CI

# Quality gate: runs on every push to main and on every pull request.
# The `quality` job is BLOCKING — wire it as a required status check in
# GitHub branch protection so a red build cannot be merged into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Tests (vitest — RBAC, tenant isolation, compliance, automation)
        run: npm run test

      - name: Build (vite)
        run: npm run build

  # Cross-tenant RLS isolation — impersonates authenticated users + anon and
  # asserts no relation leaks another org (reads, anon, child tables, writes).
  # Catches the class of bug fixed 2026-07-08 (properties_active, team_members…).
  # Set the RLS_TEST_DB_URL secret to a STAGING DB seeded with >=2 orgs to enable;
  # skips (green) until then, fails the build on any leak once wired.
  #
  # DEUX USERS MONO-ORG STABLES REQUIS. Le test a besoin de deux utilisateurs
  # appartenant chacun à UNE seule org distincte. Il pioche en priorité la
  # fixture dédiée (rlsfix.user0/1@fixture.lume.test), semée une fois par
  # `npm run seed:rls` et JAMAIS touchée par les suites QA — sans elle, il
  # retombait sur des memberships aléatoires que le QA crée/supprime, d'où un
  # flake « Need >=2 single-org users » sur des PR sans rapport. La fixture est
  # persistante dans staging ; re-semer seulement après un `db:clone-staging`.
  rls-isolation:
    name: RLS cross-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Le secret DOIT être là partout où GitHub le fournit : push sur main, ou PR
    # de ce dépôt ouverte par un humain. Avant, un secret absent faisait
    # « exit 0 » en silence — la vérification affichait « success » alors que
    # rien n'avait tourné. GitHub ne passe pas les secrets aux PR de forks ni
    # à Dependabot (github.actor décide des privilèges, re-run compris) : là
    # seulement, sauter reste légitime.
    env:
      SECRET_ATTENDU: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: RLS isolation test
        env:
          DB_URL: ${{ secrets.RLS_TEST_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            if [ "$SECRET_ATTENDU" = "true" ]; then
              echo "::error::RLS_TEST_DB_URL absent alors que ce contexte y a droit — la garde ne tourne pas. Rétablir le secret du dépôt."
              exit 1
            fi
            echo "::warning::RLS_TEST_DB_URL not set — skipping cross-tenant isolation test. Add a staging (>=2 orgs) DB connection string as the RLS_TEST_DB_URL repo secret to enable."
            exit 0
          fi
          npm run test:rls
      # Le détecteur qui aurait attrapé team_members.full_name (sélecteur
      # d'assignation mort, audit QA 2026-09-09) — il n'était jamais lancé.
      # Lit pg_catalog via la même connexion staging ; aucun jeton d'API.
      - name: Colonnes / valeurs / RPC citées par le code existent en base
        env:
          DB_URL: ${{ secrets.RLS_TEST_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            if [ "$SECRET_ATTENDU" = "true" ]; then
              echo "::error::RLS_TEST_DB_URL absent alors que ce contexte y a droit — la garde ne tourne pas. Rétablir le secret du dépôt."
              exit 1
            fi
            echo "::warning::RLS_TEST_DB_URL not set — skipping check:schema-refs."
            exit 0
          fi
          npm run check:schema-refs

  # Non-blocking: surfaces vulnerable dependencies without failing the merge.
  # Promote to blocking later by removing continue-on-error.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm audit (high severity)
        run: npm audit --audit-level=high

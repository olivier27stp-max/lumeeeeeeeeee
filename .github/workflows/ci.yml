name: CI

# Quality gate: runs on every push to main and on every pull request.
# The `quality` job is BLOCKING — wire it as a required status check in
# GitHub branch protection so a red build cannot be merged into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Tests (vitest — RBAC, tenant isolation, compliance, automation)
        run: npm run test

      - name: Build (vite)
        run: npm run build

  # Non-blocking: surfaces vulnerable dependencies without failing the merge.
  # Promote to blocking later by removing continue-on-error.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: npm audit (high severity)
        run: npm audit --audit-level=high

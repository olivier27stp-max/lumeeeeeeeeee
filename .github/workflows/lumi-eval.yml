# Évaluation continue de Lumi — la batterie de scripts/qa/evaluer-lumi.mjs
# (demandes réelles en français, vérité tirée de la base staging, correcteur
# déterministe) tourne chaque semaine et à la demande. Chaque passe coûte de
# l'inférence (≈ 0,60 $ sur Sonnet 5) : hebdomadaire, pas à chaque push.
#
# Depuis le 2026-09-17, la même passe exécute aussi RÉELLEMENT chaque outil
# d'écriture sur staging (0 $) et rejoue les 171 demandes d'outils (≈ 2 $).
# Elle ÉCHOUE si le taux d'erreur dépasse SEUIL_ERREUR_PCT : c'est le filet
# qui dit si une consigne, un outil ou un modèle a dégradé Lumi. Le rapport
# JSON complet est joint à l'exécution (artefact).
#
# Secrets requis (staging uniquement, jamais la prod) :
#   LUMI_EVAL_SUPABASE_URL, LUMI_EVAL_SUPABASE_ANON_KEY, LUMI_EVAL_SERVICE_ROLE_KEY,
#   LUMI_EVAL_PROJECT_REF, ANTHROPIC_API_KEY
name: Lumi — évaluation

on:
  schedule:
    - cron: '0 10 * * 1'   # lundi 10:00 UTC (6 h à Montréal)
  workflow_dispatch:
    inputs:
      seuil:
        description: 'Taux d’erreur maximal toléré (%)'
        default: '15'
        required: false
      modele:
        description: 'Modèle à évaluer (vide = défaut du code, claude-haiku-4-5, claude-opus-5…)'
        default: ''
        required: false

concurrency:
  group: lumi-eval
  cancel-in-progress: false

jobs:
  evaluer:
    name: Batterie Lumi sur staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEUIL_ERREUR_PCT: ${{ github.event.inputs.seuil || '15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Secrets présents ?
        id: secrets
        env:
          URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Secrets LUMI_EVAL_* / ANTHROPIC_API_KEY absents — évaluation sautée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Démarrer l'API (staging)
        if: steps.secrets.outputs.ok == 'true'
        env:
          NODE_ENV: test
          PORT: 3012
          API_PORT: 3012
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.LUMI_EVAL_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LUMI_MODEL: ${{ github.event.inputs.modele || '' }}
          LUMI_TOURS_PAR_HEURE: '0'
          SUBSCRIPTION_GUARD: log
        run: |
          echo "Modèle évalué : ${LUMI_MODEL:-défaut du code}"
          # Secret de signature des jetons agent : obligatoire au démarrage,
          # éphémère ici (aucun jeton n'a besoin de survivre à l'exécution).
          export AGENT_JWT_SECRET="$(openssl rand -base64 48)"
          nohup npx tsx server/index.ts > api.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 1
            if curl -s -o /dev/null http://localhost:3012/api/lumi/quota; then echo "API prête après ${i}s"; break; fi
          done
          if ! curl -s -o /dev/null http://localhost:3012/api/lumi/quota; then echo "::error::L'API n'a pas démarré"; grep -v 'npm warn' api.log | tail -n 40; exit 1; fi

      - name: Évaluer
        if: steps.secrets.outputs.ok == 'true'
        env:
          QA_API_URL: http://localhost:3012
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.LUMI_EVAL_PROJECT_REF }}
        run: |
          set +e
          node scripts/qa/evaluer-lumi.mjs --sortie qa-lumi-evaluation.json
          set -e
          node -e '
            const r = require("./qa-lumi-evaluation.json");
            const seuil = Number(process.env.SEUIL_ERREUR_PCT || 15);
            console.log(`Taux d’erreur : ${r.taux_erreur_pct} % (seuil ${seuil} %) · ${r.ok}/${r.total} · coût ${(r.cout_cents/100).toFixed(2)} $`);
            for (const [cat, v] of Object.entries(r.par_categorie || {})) console.log(`  ${cat}: ${JSON.stringify(v)}`);
            if (r.taux_erreur_pct > seuil) { console.error(`::error::Lumi dégradé : ${r.taux_erreur_pct} % d’erreurs > ${seuil} %`); process.exit(1); }
          '

      # Fiabilité (2026-09-17) : chaque outil d'écriture est EXÉCUTÉ sur staging
      # (JWT + RLS, mêmes routes), sans LLM — 0 $. Une erreur = échec du job.
      - name: Seed de l'org QA (idempotent)
        if: steps.secrets.outputs.ok == 'true'
        env:
          PORT: 3012
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.LUMI_EVAL_PROJECT_REF }}
        run: npx tsx scripts/qa/seed-outils-staging.mts

      - name: Exécution réelle de chaque outil d'écriture
        if: steps.secrets.outputs.ok == 'true'
        env:
          PORT: 3012
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.LUMI_EVAL_PROJECT_REF }}
        run: |
          set +e
          npx tsx scripts/qa/executer-outils-staging.mts --sortie qa-execution.json
          code=$?
          set -e
          node -e '
            const r = require("./qa-execution.json");
            console.log(`Exécution : ${r.bilan.ok} ok · ${r.bilan.erreur} erreur · ${r.bilan.exclu} exclu · ${r.bilan.non_couvert} non couvert`);
            for (const x of r.resultats.filter((x) => x.verdict === "erreur")) console.error(`::error::${x.outil} : ${x.detail}`);
            if (r.bilan.erreur > 0) process.exit(1);
          '

      # Les 171 demandes naturelles (une par outil) : proposition attendue. ≈ 2 $ la passe, hebdomadaire.
      - name: Batterie des outils (propositions)
        if: steps.secrets.outputs.ok == 'true'
        env:
          QA_API_URL: http://localhost:3012
          VITE_SUPABASE_URL: ${{ secrets.LUMI_EVAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.LUMI_EVAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LUMI_EVAL_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.LUMI_EVAL_PROJECT_REF }}
        run: |
          set +e
          npx tsx scripts/qa/evaluer-outils.mts --sortie qa-outils.json
          set -e
          node -e '
            const r = require("./qa-outils.json");
            const b = r.bilan;
            console.log(`Outils : ${b.exact} exact · ${b.partiel} partiel · ${b.rate} raté · ${b.erreur} erreur / ${b.total} · ${(b.cout_cents/100).toFixed(2)} $`);
            const part = (b.rate + b.erreur) / b.total * 100;
            if (part > 5) { console.error(`::error::Batterie des outils dégradée : ${part.toFixed(1)} % de ratés/erreurs (> 5 %)`); process.exit(1); }
          '

      - name: Rapport
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumi-evaluation-${{ github.run_id }}
          path: |
            qa-lumi-evaluation.json
            qa-execution.json
            qa-outils.json
            api.log
          retention-days: 90
